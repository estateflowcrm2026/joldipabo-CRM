<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9E3A0C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Joldipabo" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/joldipabo-logo.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="/joldipabo-logo.jpg" />
    <title>Joldipabo CRM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register the service worker if supported. Errors are non-fatal —
      // the app must keep working without offline.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('[Joldipabo] SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
